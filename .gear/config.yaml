schema_version: 1
default_mode: auto

classification:
  quick_signals:
    - clear-localized-change
    - no-public-contract-change
  standard_signals:
    - bounded-feature
    - unresolved-implementation-decisions
  full_signals:
    - data-migration
    - public-api-change
    - cross-service-change
    - module-rewrite

standard:
  test_policy: ask-after-implementation
  use_worktree: false

full:
  engine: superpowers

artifacts:
  root: .gear
